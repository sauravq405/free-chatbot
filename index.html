<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>free-chat-bot</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-image: url("img/background.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: white;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        background: rgba(0, 0, 0, 0.7);
        max-width: 700px;
        margin: 50px auto;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        height: 80%;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .chat-area {
        flex: 1;
        overflow-y: auto;
        padding-right: 10px;
      }

      .chat-bubble {
        background: #333;
        padding: 12px 20px;
        border-radius: 20px;
        margin: 8px 0;
        max-width: 70%;
        font-size: 1.1rem;
        line-height: 1.4;
        position: relative;
        word-wrap: break-word;
      }

      .chat-bubble.user {
        background: #0066cc;
        align-self: flex-end;
      }

      .chat-bubble.bot {
        background: #444;
        align-self: flex-start;
      }

      .copy-btn {
        position: absolute;
        top: 50%;
        right: -30px;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.5rem;
        color: #fff;
        opacity: 0.7;
      }

      .copy-btn:hover {
        opacity: 1;
      }

      .form-group {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      .form-group textarea {
        flex: 1;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid #fff;
        color: white;
        padding: 12px 20px;
        border-radius: 25px;
        resize: none;
        height: 50px;
      }

      .form-group button {
        background: #ff5722;
        border: none;
        padding: 14px 20px;
        border-radius: 25px;
        color: white;
        cursor: pointer;
      }

      .form-group button:hover {
        background: #e64a19;
      }

      footer {
        text-align: center;
        padding: 40px 0;
        font-size: 0.9rem;
      }

      .loading {
        color: #ff5722;
        font-weight: bold;
        margin-top: 10px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Free Generative AI 🇮🇳</h2>

      <div id="response" class="chat-area"></div>

      <div class="form-group">
        <textarea
          id="userInput"
          class="form-control"
          placeholder="Enter your question"
        ></textarea>
        <button onclick="sendMessage()">Ask!</button>
      </div>
    </div>

    <footer>Powered by OpenRouter AI</footer>

    <script>
      async function sendMessage() {
        const input = document.getElementById("userInput").value;
        const responseDiv = document.getElementById("response");

        if (!input.trim()) {
          responseDiv.innerHTML +=
            '<div class="chat-bubble bot">Please enter a message.</div>';
          return;
        }

        responseDiv.innerHTML += `<div class="chat-bubble user">${input}</div>`;
        responseDiv.innerHTML += '<div class="loading">Loading...</div>';
        responseDiv.scrollTop = responseDiv.scrollHeight;

        document.getElementById("userInput").value = "";

        try {
          const response = await fetch(
            "https://free-chatbot-backend.netlify.app/.netlify/functions/chat",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                messages: [{ role: "user", content: input }],
              }),
            }
          );

          const data = await response.json();
          const markdown =
            data.choices?.[0]?.message?.content || "No response received.";

          responseDiv.innerHTML = responseDiv.innerHTML.replace(
            '<div class="loading">Loading...</div>',
            ""
          );

          responseDiv.innerHTML += `<div class="chat-bubble bot">${marked.parse(
            markdown
          )}</div>`;

          responseDiv.scrollTop = responseDiv.scrollHeight;
          addCopyButton();
        } catch (err) {
          responseDiv.innerHTML += `<div class="chat-bubble bot">Error: ${err.message}</div>`;
        }
      }

      document
        .getElementById("userInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            sendMessage();
          }
        });

      function addCopyButton() {
        document.querySelectorAll(".chat-bubble.bot").forEach((msg) => {
          if (!msg.querySelector(".copy-btn")) {
            const btn = document.createElement("button");
            btn.className = "copy-btn";
            btn.innerHTML = '<i class="fas fa-copy"></i>';
            btn.onclick = () => copyToClipboard(msg.innerText);
            msg.appendChild(btn);
          }
        });
      }

      function copyToClipboard(text) {
        const t = document.createElement("textarea");
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
        alert("Response copied to clipboard!");
      }
    </script>
  </body>
</html>
